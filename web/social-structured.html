*{box-sizing:border-box}
body{margin:0;background:#EDEEF2;font-family:"Poppins","Segoe UI",system-ui,sans-serif;color:#14161D}
.page{max-width:1180px;margin:0 auto;padding:36px 24px 80px}.page h1{font-weight:800;font-size:1.7rem;margin:0 0 20px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}@media(max-width:900px){.gallery{grid-template-columns:1fr}}
figcaption{font-weight:600;margin-bottom:8px}
.frame{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 10px 40px rgba(20,22,34,.14)}
.artboard{position:absolute;top:0;left:0;overflow:hidden}
.slide{width:1080px;height:1350px;background:#FBFBFD;position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.logo{position:absolute;top:120px;left:0;right:0;display:flex;justify-content:center;z-index:3}.logo img{height:64px}
.txt{position:absolute;left:80px;right:80px;z-index:3;text-align:center}
.kick{font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:26px;color:#1D50CF;margin:0 0 28px}
.head{font-weight:700;letter-spacing:-.02em;color:#14161D;line-height:1.4;font-size:78px;margin:0}
.line{font-size:58px;line-height:1.5;color:#14161D;margin:0}
.reg{font-weight:600}.bold{font-weight:800}.it{font-weight:700;font-style:italic}
.hl{background:#1D50CF;color:#fff;padding:.02em .2em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:nowrap}
.hlg{background:linear-gradient(120deg,#1D50CF,#903DA4,#E0497C);color:#fff;padding:.02em .2em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:nowrap}
.divider{width:180px;height:2px;background:#C9CCD5;margin:40px auto}
.sub{font-size:36px;line-height:1.5;color:#5A5F6B;font-weight:500;margin:0;max-width:22ch;margin-left:auto;margin-right:auto}.sub .b{color:#14161D;font-weight:800}
.dots{position:absolute;bottom:84px;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:3}.dots i{width:12px;height:12px;border-radius:50%;background:#D2D5DE}.dots i.on{background:#1D50CF;width:34px;border-radius:7px}
.arrow{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #C9CCD5;display:flex;align-items:center;justify-content:center;color:#8B90A0;z-index:4;background:rgba(255,255,255,.5)}
.a-rmid{right:34px;top:50%;transform:translateY(-50%)}.a-lmid{left:34px;top:50%;transform:translateY(-50%)}
.a-br{right:60px;bottom:96px;width:92px;height:92px;border-color:#14161D;color:#14161D}
.person{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:440px;z-index:2}
.pill{display:inline-flex;align-items:center;gap:14px;background:#1D50CF;color:#fff;font-weight:700;font-size:32px;padding:22px 42px;border-radius:999px}
.handle{position:absolute;bottom:150px;left:0;right:0;text-align:center;color:#5A5F6B;font-size:26px;z-index:3}
/* meme */
.meme{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 34%, #2E64EA 0%, #1D50CF 55%, #163C97 100%)}
.meme .big{position:absolute;font-weight:800;color:#fff;line-height:.92;letter-spacing:-.02em}
.meme .m1{top:158px;left:86px;font-size:166px}.meme .m2{top:340px;left:86px;font-size:170px}
.meme .tag{position:absolute;background:#fff;color:#1D50CF;font-weight:800;border-radius:10px;padding:6px 20px;font-size:46px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.meme .t1{top:300px;left:660px;transform:rotate(-6deg)}.meme .t2{top:548px;left:120px;transform:rotate(-6deg);font-size:40px}
.meme .accent{position:absolute;stroke:#E0497C;stroke-width:9;stroke-linecap:round;z-index:4}
.meme .bubble-wrap{position:absolute;top:610px;right:70px;width:430px;height:300px;z-index:5}.meme .bubble{position:absolute;inset:0;width:100%;height:100%}
.meme .btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#14161D;font-size:42px;padding:34px 48px 70px}
.personw{position:absolute;bottom:0;left:44%;transform:translateX(-50%);width:520px;z-index:3;filter:grayscale(1) drop-shadow(0 0 6px #fff) drop-shadow(0 0 6px #fff)}
.meme .handle2{position:absolute;bottom:40px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-weight:500;font-size:26px;z-index:6}
body.export{background:#fff}body.export .page{max-width:none;padding:0}body.export .page h1,body.export figcaption{display:none}body.export .gallery{display:block}body.export .frame{overflow:visible;box-shadow:none;border-radius:0;height:auto!important;width:auto;margin:0}body.export .artboard{position:static}
