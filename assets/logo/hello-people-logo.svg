<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Hello People">
  <defs>
    <linearGradient id="hpBubble" x1="188" y1="34" x2="92" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E62E80"/>
      <stop offset="0.52" stop-color="#9B3BBE"/>
      <stop offset="1" stop-color="#5B3BD4"/>
    </linearGradient>
    <linearGradient id="hpRing" x1="54" y1="34" x2="54" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BF0"/>
      <stop offset="1" stop-color="#1B49CE"/>
    </linearGradient>
    <linearGradient id="hpPeople" x1="250" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F5CE6"/>
      <stop offset="0.5" stop-color="#7B3FD0"/>
      <stop offset="1" stop-color="#E62E80"/>
