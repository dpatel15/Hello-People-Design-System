  <!-- Mark -->
  <g transform="translate(0,22)">
    <path d="M112,12 L166,12 Q188,12 188,34 L188,86 Q188,108 166,108 L164,108 L179,131 L150,108 L112,108 Q90,108 90,86 L90,34 Q90,12 112,12 Z" fill="url(#hpBubble)"/>
    <text x="149" y="75" text-anchor="middle" font-family="Poppins, 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="47" letter-spacing="1.5" fill="#FFFFFF">AI</text>
    <path d="M31,84 L15,110 L49,92 Z" fill="#2357E6"/>
    <circle cx="54" cy="56" r="40" fill="none" stroke="url(#hpRing)" stroke-width="13"/>
  </g>

  <!-- Wordmark -->
